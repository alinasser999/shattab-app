include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "artifacts/**/baseline/**"
    - "artifacts/**/baseline-source/**"
    - "artifacts/ui-ux-makeover/**/b1-source/**"
  errors:
    invalid_annotation_target: ignore
    unnecessary_import: ignore

linter:
  rules:
    unnecessary_underscores: false
