org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# Run Kotlin compiler in the Gradle process instead of a separate daemon.
# Fixes "Could not connect to Kotlin compile daemon" on Windows where antivirus
# or firewall blocks the daemon's loopback socket.
kotlin.compiler.execution.strategy=in-process
kotlin.daemon.useFallbackStrategy=true
org.gradle.daemon=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
