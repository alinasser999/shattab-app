openapi: 3.1.0
info:
  title: Shattab Business API
  version: 1.0.0
  description: >-
    Target contract for the Shattab business API. This local design artifact
    does not assert that business operations are implemented or deployed.
    The dated local and live evidence, current migration blockers, and target
    boundaries are recorded in x-migration-readiness.
servers:
  - url: /api/v1
    description: Relative API base on the configured Shattab origin
security: []
x-migration-readiness:
  evidence-date: "2026-10-26"
  contract-status: target-design-only
  current-state:
    business-api: not-implemented-or-deployed
    flutter-and-admin: direct-supabase-dependencies-remain
    oracle-stage-api-container: absent-in-read-only-snapshot
    providers: Cognito-R2-OCI-Object-Storage-and-server-controlled-FCM-APNs-are-targets-only
  local-source:
    migration-files: 90
    latest-migration-version: "20261013140000"
    brief-photos-bucket-configured-public: true
    brief-photos-folder-policy: owner-folder-only
    media-validation-function-makes-bucket-private: false
  live-supabase-read-only-snapshot:
    project-status: ACTIVE_HEALTHY
    postgres-version: "17.6.1.166"
    region: eu-central-1
    aggregate-counts-only:
      auth-users: 33
      profiles: 33
      auth-identities: 20
      requests: 16
      offers: 2
      posts: 6
      portfolio-projects: 13
    brief-photos:
      public: true
      objects: 4
    migration-ledger:
      live-entries: 84
      local-entries: 90
      shared-names: 63
      shared-name-version-mismatches: 50
      exact-name-version-pairs: 13
      local-only: 27
      live-only: 21
      comparison-limit: Metadata names and versions only; not SQL or schema equivalence.
    security-metadata:
      public-security-definer-functions: 57
      anon-executable-security-definer-functions: 7
      function-bodies-fetched: false
      interpretation: Review requirement only; counts do not establish a vulnerability.
    edge-functions:
      send-push:
        active: true
        platform-verify-jwt: false
        handler-guards-reviewed: false
      assistant-chat:
        active: true
        platform-verify-jwt: true
        handler-guards-reviewed: false
      validated-media-upload:
        present-in-live-list: false
        present-in-local-source: true
    linked-cli-migration-reconciliation:
      complete: false
      reason: No Supabase access token was available; none was requested or inspected.
  hard-blockers-before-private-media-or-api-production-cutover:
    - Live brief-photos is public and contains four objects; private access is not established.
    - Reconcile local/live migration, schema, function, policy, and grant drift against a reviewed baseline; do not bulk replay local migrations.
    - Resolve Cognito subject mapping to existing internal accounts without phone/email auto-linking.
    - Approve and rehearse media privatization/conversion, legacy URL retirement, public cache handling, and Flutter private-cache isolation/purge.
    - Define request-media retention and deletion timing separately; authorized complaint/supervision review may apply to retained media after request completion or cancellation.
    - Approve and operationalize request_media.review grant/revoke authority and fail-closed access auditing.
    - Verify old client compatibility, notification authorization/ownership, billing/entitlement ownership, and successful restore/authorization tests.
tags:
  - name: health
  - name: identity
  - name: discovery
  - name: requests
  - name: offers
  - name: contact
  - name: community
  - name: saved-items
  - name: reviews
  - name: notifications
  - name: verification
  - name: billing
  - name: administration
paths:
  /health/live:
    get:
      servers:
        - url: /
      operationId: getHealthLive
      tags: [health]
      summary: Check process liveness
      description: Process-only probe; it does not disclose dependency state.
      x-contract-status: local-foundation-target
      security: []
      responses:
        '200':
          description: The process is alive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        default:
          $ref: '#/components/responses/Problem'
  /health/ready:
    get:
      servers:
        - url: /
      operationId: getHealthReady
      tags: [health]
      summary: Check service readiness
      description: Readiness stays non-sensitive and returns 503 when the service cannot serve requests.
      x-contract-status: local-foundation-target
      security: []
      responses:
        '200':
          description: The process is initialized and accepting requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthEnvelope'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /me:
    get:
      operationId: getMe
      tags: [identity]
      summary: Read the authenticated account summary
      description: Resolve the verified provider subject to exactly one internal Shattab identity. The target Cognito sub must come from a token whose signature, issuer, audience/client, expiry, and token use were verified by the trusted API; never accept a caller-supplied account ID, role, or identity claim. Never auto-link by phone or email. Ambiguous or duplicate mappings fail closed for manual reconciliation.
      x-contract-status: planned
      x-enablement-gates: [identity-subject-mapping-and-account-reconciliation]
      security:
        - ConsumerBearerAuth: []
      responses:
        '200':
          description: The caller's self-safe account summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '401':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /me/bootstrap:
    post:
      operationId: bootstrapMe
      tags: [identity]
      summary: Bootstrap a verified new account
      description: A verified, unmapped provider subject may be bootstrapped under the server's account policy. No identity, role, or account ID is accepted from the body. Never auto-link existing accounts by phone or email; ambiguous or duplicate mappings fail closed for manual reconciliation.
      x-contract-status: planned
      x-enablement-gates: [verified-new-subject-policy, existing-account-linking-runbook]
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '201':
          description: A new internal account was created for the verified subject.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '200':
          description: The original result for an idempotent retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /me/onboarding:
    post:
      operationId: completeMeOnboarding
      tags: [identity]
      summary: Select a consumer role once
      description: The trusted server derives account identity and permits only the existing one-time homeowner or contractor onboarding choice; it owns the role lock and completion state. A caller-supplied role is not accepted as an identity or authorization claim.
      x-contract-status: planned
      x-enablement-gates: [hosted-role-lock-parity, onboarding-fields-reconciliation]
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OnboardingInput'
      responses:
        '200':
          description: Role was set or a matching retry result was returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '201':
          description: The onboarding profile was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeEnvelope'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /me/profile:
    get:
      operationId: getMyProfile
      tags: [identity]
      summary: Read the caller's own profile
      x-contract-status: planned
      security:
        - ConsumerBearerAuth: []
      responses:
        '200':
          description: The caller's self profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateMyProfile
      tags: [identity]
      summary: Update the caller's display name
      description: V1 only accepts fullName. Avatar changes wait for the public-media contract; phone, role, verification, plan, and ownership are not writable here.
      x-contract-status: planned
      x-enablement-gates: [profile-write-and-public-avatar-media-reconciliation]
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProfileUpdateInput'
      responses:
        '200':
          description: Updated self profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileEnvelope'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /contractors:
    get:
      operationId: listContractors
      tags: [discovery]
      summary: Browse public contractor profiles
      description: Guest-safe projection; excludes phone, private verification data, auth claims, and billing internals. Filters and ranking wait for parity review.
      x-contract-status: planned
      x-enablement-gates: [directory-filter-and-ranking-parity]
      security: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of public contractor projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractorPageEnvelope'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /contractors/{contractorId}:
    get:
      operationId: getContractor
      tags: [discovery]
      summary: Read a public contractor profile
      description: Does not disclose phone or private verification fields.
      x-contract-status: planned
      security: []
      parameters:
        - $ref: '#/components/parameters/ContractorId'
      responses:
        '200':
          description: Public contractor profile projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContractorEnvelope'
        '404':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /contractors/{contractorId}/portfolio:
    get:
      operationId: listContractorPortfolio
      tags: [discovery]
      summary: List approved public portfolio items
      description: Only media approved for public delivery may appear; private request and verification media are excluded.
      x-contract-status: planned
      x-enablement-gates: [public-media-approval-and-r2-adapter]
      security: []
      parameters:
        - $ref: '#/components/parameters/ContractorId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of public portfolio metadata.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PortfolioPageEnvelope'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /contractors/{contractorId}/reviews:
    get:
      operationId: listContractorReviews
      tags: [discovery, reviews]
      summary: List published contractor reviews
      description: The projection omits private reviewer details.
      x-contract-status: planned
      security: []
      parameters:
        - $ref: '#/components/parameters/ContractorId'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of published reviews.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReviewPageEnvelope'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /me/requests:
    get:
      operationId: listMyRequests
      tags: [requests]
      summary: List the caller's homeowner requests
      description: The server derives the owner from verified identity.
      x-contract-status: planned
      x-required-role: homeowner
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of the caller's own requests.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPageEnvelope'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /opportunities:
    get:
      operationId: listOpportunities
      tags: [requests]
      summary: List currently eligible open opportunities
      description: The server recomputes service area, visibility, and entitlement. No contractor-after-acceptance photo access is implied.
      x-contract-status: planned
      x-required-role: contractor
      x-enablement-gates: [opportunity-filter-and-quote-write-eligibility-parity]
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: A page of eligible opportunity projections.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestPageEnvelope'
        '401':
          $ref: '#/components/responses/Problem'
        '403':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /requests/{requestId}:
    get:
      operationId: getRequest
      tags: [requests]
      summary: Read an authorized request projection
      description: Accessible to its owner, currently eligible contractors on open public requests, or the selected contractor on directed requests. Acceptance grants no extra photo access.
      x-contract-status: planned
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Authorized request projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestEnvelope'
        '404':
          $ref: '#/components/responses/Problem'
        '503':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      operationId: updateRequest
      tags: [requests]
      summary: Update an owned editable request
      description: The server checks ownership and editable state. The input allowlist excludes owner, status, and lifecycle transitions.
      x-contract-status: planned
      x-enablement-gates: [hosted-editable-state-and-field-parity]
      x-required-role: homeowner
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestUpdateInput'
      responses:
        '200':
          description: Updated request projection.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestEnvelope'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /requests:
    post:
      operationId: createRequest
      tags: [requests]
      summary: Create a homeowner request
      description: The server derives ownership and state. Attached staged media is reauthorized; callers cannot set status, hire, or completion fields.
      x-contract-status: planned
      x-required-role: homeowner
      x-enablement-gates: [hosted-schema-parity, private-media-url-to-id-migration, private-request-photo-client-cache-and-legacy-url-cutover-rehearsal]
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestCreateInput'
      responses:
        '201':
          description: Request created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestEnvelope'
        '200':
          description: Original result for a matching idempotent retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestEnvelope'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /requests/{requestId}/cancellation:
    post:
      operationId: cancelRequest
      tags: [requests]
      summary: Remove a request from the active marketplace
      description: Server chooses the safe outcome based on related offer history; body cannot set request status.
      x-contract-status: planned
      x-required-role: homeowner
      x-enablement-gates: [cancellation-state-parity]
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Request is no longer active.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequestCancellationEnvelope'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /me/request-media:
    post:
      operationId: uploadRequestMedia
      tags: [requests]
      summary: Upload one staged private request image
      description: Inspect bytes rather than trusting a claimed MIME type. Return an opaque mediaId only, never a storage URL.
      x-contract-status: planned
      x-required-role: homeowner
      x-enablement-gates: [private-image-validation-reprocessing-and-old-client-plan, private-request-photo-client-cache-and-legacy-url-cutover-rehearsal]
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PrivateImageUploadInput'
      responses:
        '201':
          description: Staged private media reference.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StagedMediaEnvelope'
        '413':
          $ref: '#/components/responses/Problem'
        '415':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /me/request-media/{mediaId}:
    delete:
      operationId: deleteStagedRequestMedia
      tags: [requests]
      summary: Delete unattached staged request media
      description: Only the owning caller may delete staged media that is not attached to a request.
      x-contract-status: planned
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '204':
          description: Staged media was deleted or was already absent for this caller.
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /requests/{requestId}/media:
    get:
      operationId: listRequestMedia
      tags: [requests]
      summary: List media references visible for this request
      description: >-
        Require a valid consumer bearer token before any request or media lookup; absent or invalid
        credentials receive a uniform 401 independent of resource existence. On this consumer route, only
        the request owner or the contractor whose offer was accepted may list media while the project is
        active. Return the same generic 404 Problem with code NOT_FOUND for an absent request, an
        unauthorized relationship, or a completed/cancelled/inactive request; do not distinguish these cases
        or return a count, hasMedia flag, URL, or other existence signal. Open-request eligibility or a
        directed request alone grants no photo access. Recheck relationship and lifecycle on every call.
        Listing opaque references does not authorize a later byte read. Cache-Control is required and
        restricted to no-store. Before private bytes are enabled, migrate existing media under a separately
        approved and rehearsed plan, retire old public-URL clients, and have Flutter bypass the shared image
        cache or isolate it by authenticated identity/session and media version, then purge it on sign-out
        or account switch. HTTP no-store does not purge the Flutter cache. Live Supabase evidence dated
        2026-10-26 reports brief-photos is public with four objects; this is a hard blocker, not evidence
        that this target policy is enforced.
      x-contract-status: planned
      x-enablement-gates: [private-media-relationship-policy-and-migration, live-public-brief-photos-media-migration, local-live-schema-policy-grant-reconciliation, private-request-photo-client-cache-and-legacy-url-cutover-rehearsal]
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: Authorized opaque references and safe display ordering only.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MediaReferenceListEnvelope'
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/OpaqueRequestMediaNotFound'
        default:
          $ref: '#/components/responses/Problem'
  /request-media/{mediaId}/content:
    get:
      operationId: readRequestMediaContent
      tags: [requests]
      summary: Stream authorized private request-media bytes
      description: >-
        The mediaId is not a credential. Require a valid consumer bearer token before any resource lookup;
        absent or invalid credentials receive a uniform 401 independent of whether the media exists. On this
        consumer route, only the request owner or the contractor whose offer was accepted may read while the
        project is active; deny before acceptance and after completion or cancellation. Return the same
        generic 404 Problem with code NOT_FOUND for missing media, an unauthorized relationship, or an
        inactive/completed/cancelled request; never distinguish these outcomes or reveal resource existence.
        Reauthorize relationship and lifecycle on every byte read. Stream private bytes through the
        authenticated API with Cache-Control no-store; never redirect to a reusable signed URL. Flutter must
        bypass the shared image cache initially or key a private cache by authenticated identity/session and
        media version and purge it on sign-out or account switch. HTTP no-store is not a substitute for
        client-cache isolation or purge. The live public brief-photos bucket and legacy public URLs/caches
        are hard cutover blockers until media migration and retirement are approved, rehearsed, and
        verified.
      x-contract-status: planned
      x-enablement-gates: [private-media-relationship-policy-and-migration, live-public-brief-photos-media-migration, local-live-schema-policy-grant-reconciliation, private-request-photo-client-cache-and-legacy-url-cutover-rehearsal]
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/MediaId'
      responses:
        '200':
          description: Private media bytes for an authorized relationship.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Problem'
        '404':
          $ref: '#/components/responses/OpaqueRequestMediaNotFound'
        default:
          $ref: '#/components/responses/Problem'
  /requests/{requestId}/offers:
    post:
      operationId: createOffer
      tags: [offers]
      summary: Submit an offer on an eligible open request
      description: Server derives the contractor and enforces both read visibility and write eligibility, including one active offer per contractor/request.
      x-contract-status: planned
      x-required-role: contractor
      x-enablement-gates: [contractor-write-eligibility-and-entitlement-parity]
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/RequestId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OfferInput'
      responses:
        '201':
          description: Offer created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferEnvelope'
        '200':
          description: Original result for a matching idempotent retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfferEnvelope'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
    get:
