components:
  securitySchemes:
    ConsumerBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Target Cognito bearer token. The trusted API verifies signature, issuer, audience/client, expiry, and expected token use, then maps verified sub to exactly one internal Shattab identity. Never trust caller-supplied account ID, role, or identity claims; never auto-link by phone/email. Duplicate or ambiguous mappings fail closed for manual reconciliation. PostgreSQL identity is transaction-scoped after verification; the runtime role is least-privilege and neither owns protected tables nor bypasses row security.
    AdminBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Separate logical operator identity and capability contract. Provider issuer, account continuity, and capability grant/revoke workflow remain unresolved; ordinary admin membership alone does not grant request_media.review.
  parameters:
    Limit:
      name: limit
      in: query
      required: false
      description: Page size. Defaults to 20 and is bounded from 1 to 50.
      schema:
        type: integer
        minimum: 1
        maximum: 50
        default: 20
    Cursor:
      name: cursor
      in: query
      required: false
      description: Opaque, tamper-resistant cursor bound to filter/order context and to the caller for private collections.
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Retry key scoped to verified principal, operation/resource, and payload digest.
      schema:
        type: string
    ContractorId:
      name: contractorId
      in: path
      required: true
      schema:
        type: string
    RequestId:
      name: requestId
      in: path
      required: true
      schema:
        type: string
    MediaId:
      name: mediaId
      in: path
      required: true
      schema:
        type: string
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
    PostId:
      name: postId
      in: path
      required: true
      schema:
        type: string
    CommentId:
      name: commentId
      in: path
      required: true
      schema:
        type: string
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
    NotificationId:
      name: notificationId
      in: path
      required: true
      schema:
        type: string

  responses:
    Problem:
      description: Safe RFC 9457 problem response with a stable Shattab error code.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    OpaqueRequestMediaNotFound:
      description: >-
        Generic 404 Problem with code NOT_FOUND and no resource-specific detail.
        Reuse this exact response for missing request-media resources and
        authenticated callers without the required relationship or capability.
        On consumer routes, inactive, completed, or cancelled requests also use
        this response. On admin review routes, lifecycle closure alone does not
        deny access to retained media when request_media.review is granted.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    HealthEnvelope:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [status]
          properties:
            status:
              type: string
              enum: [ok]
          additionalProperties: false
      additionalProperties: false
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      properties:
        type:
          type: string
          format: uri-reference
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: Safe, non-sensitive detail; clients localize by code.
        instance:
          type: string
          format: uri-reference
        code:
          type: string
          description: Stable machine-readable Shattab error code.
        fieldErrors:
          type: array
          items:
            $ref: '#/components/schemas/FieldError'
        requestId:
          type: string
      additionalProperties: false
    FieldError:
      type: object
      required: [field, code]
