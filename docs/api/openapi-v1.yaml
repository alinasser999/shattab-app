        uniform 401 independent of resource existence. Check request_media.review and durably record each
        attempt, including denials, using the supplied requestId and purpose before any request or media
        existence lookup. If the capability is absent, return the same generic 404 Problem (code NOT_FOUND)
        as for a missing request. If capability checking or the durable audit system fails, fail closed with
        a generic 503 before resource lookup. The `request_media.review` capability is granted manually and remains effective
        until manually revoked; an administrator may review retained media for complaint or
        supervision even after request completion or cancellation; lifecycle closure alone
        does not deny admin access.
