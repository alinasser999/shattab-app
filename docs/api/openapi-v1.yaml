        view before returning references. No case ID is required; opening ordinary queue rows must not fetch
        photos. Unapproved assumption only: the existing least-privilege owner admin role would be the sole
        grant/revoke authority and could not self-grant. This is not current enforcement or an approved
        grantor policy. Retention and deletion timing for request media remain unresolved; gate production
