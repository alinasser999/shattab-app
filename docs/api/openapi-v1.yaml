  /contact-handoffs:
    post:
      operationId: createContactHandoff
      tags: [contact]
      summary: Create an authorized phone or WhatsApp handoff
      description: Authenticated homeowner or contractor may request a handoff to another contractor from a profile or contractor post; prevent self-contact for the post owner. No phone number appears in public profile/post projections. A guest is routed by the client to signup/sign-in and, after successful authentication/onboarding, returns to the same detail and must tap again; this endpoint does not accept guest events and the client must not auto-launch after sign-in. Record authenticated intent, then return only a short-lived sensitive OS launch target with Cache-Control no-store. Record client-attested OS launch acceptance separately; neither event proves a call, sent message, conversation, or reply. Analytics may contain only channel, source surface, and observed handoff result; do not log phone, name, email, message text, launch URI, location, or target contractor identifier. Event retention and identity linkage remain unresolved and must not be invented here.
      x-contract-status: planned
      x-enablement-gates: [contact-target-policy-and-rate-controls, contact-telemetry-retention-and-identity-policy]
      x-idempotent-telemetry: A retry with the same idempotency key returns the original result and must not duplicate intent telemetry.
      security:
        - ConsumerBearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContactHandoffInput'
      responses:
        '201':
          description: Authorized handoff target.
          headers:
            Cache-Control:
              required: true
              schema:
                type: string
                enum: [no-store]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactHandoffEnvelope'
        '404':
          $ref: '#/components/responses/Problem'
        '422':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
  /contact-handoffs/{handoffId}/accepted:
    post:
      operationId: recordAcceptedContactHandoff
      tags: [contact]
      summary: Record that the operating system accepted a contact launch
      description: Record only the authenticated caller's client-attested acceptance of the OS launch for their matching handoff. This does not assert that a call connected, a WhatsApp message was sent, a conversation started, or anyone replied. A retry with the same idempotency key returns the prior result and must not duplicate telemetry. Do not log phone, name, email, message text, launch URI, location, or target contractor identifier. Event retention and identity linkage remain unresolved.
      x-contract-status: planned
      x-enablement-gates: [contact-telemetry-retention-and-identity-policy]
      security:
        - ConsumerBearerAuth: []
      parameters:
        - name: handoffId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: The matching handoff event was recorded or its retry result was returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactAcceptedEnvelope'
        '404':
          $ref: '#/components/responses/Problem'
        '409':
          $ref: '#/components/responses/Problem'
        '429':
          $ref: '#/components/responses/Problem'
        default:
          $ref: '#/components/responses/Problem'
