name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A new push to the same branch supersedes the run in flight.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Analyze & test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - run: flutter pub get

      # The repository intentionally does not track generated Riverpod/router
      # files. Generate them in CI so a clean checkout validates the same
      # source graph as a local developer build.
      - run: cp .env.example .env
      - run: dart run build_runner build

      - run: dart format --output=none --set-exit-if-changed lib test
      - run: flutter analyze --no-pub

      - run: flutter test --reporter=github
      - run: flutter build web --release
      # Keep the Android artifact unsigned in CI, but compile the native
      # release target so mobile-only plugin and manifest errors are caught.
      - run: flutter build apk --release

  admin-console:
    name: Admin console build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: admin
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin/package-lock.json

      - run: npm ci

      # The check that counts, per admin/README.md: source contracts first,
      # then types, then a real production build.
      - run: npm run audit:contracts
      - run: npm run typecheck
      - run: npm run build
        env:
          # Build-time placeholders; the console talks to the real project
          # only when deployed with its own env. No secrets live here.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

  database-contracts:
    name: Database contracts (replay + RLS)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Non-blocking on purpose, for now: this job replays the whole migration
    # directory against an empty database, and weeks of live-applied drift
    # mean the first runs may surface gaps that predate today's fixes.
    # Flip continue-on-error to false once the replay is green end to end —
    # at that point a fresh environment is provably buildable from disk.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0

      - name: Verify Supabase CLI version
        run: |
          actual="$(supabase --version)"
          printf '%s\n' "$actual"
          test "$actual" = "2.122.0"

      # Starts the disposable runner-local Supabase services. A first start can
      # initialize migrations and seed data; the reset below rebuilds the DB.
      - run: supabase start

      # Recreates the LOCAL database from scratch, applies checked-in migrations
      # in order and then seed data. This is a clean replay, not a hosted reset.
      - run: supabase db reset --local

      # pgTAP is installed only after resetting the disposable runner-local DB.
      # This is test setup, not a migration or a write to hosted Supabase.
      - name: Bootstrap pgTAP in disposable local database
        shell: bash
        run: |
          set -euo pipefail

          PGPASSWORD=postgres psql -X -qAt -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -c 'CREATE EXTENSION IF NOT EXISTS pgtap WITH SCHEMA extensions;'

          extension_schema="$(PGPASSWORD=postgres psql -X -qAt -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -c "SELECT n.nspname FROM pg_extension e JOIN pg_namespace n ON n.oid = e.extnamespace WHERE e.extname = 'pgtap';")"
          if [[ "$extension_schema" != "extensions" ]]; then
            echo "::error::Expected pgTAP in extensions, found '${extension_schema:-missing}'"
            exit 1
          fi
          echo "pgTAP extension schema: $extension_schema"

          resolved_plan="$(PGPASSWORD=postgres psql -X -qAt -v ON_ERROR_STOP=1 \
            -h localhost -p 54322 -U postgres -d postgres \
            -c "SET search_path = pg_catalog, extensions, public, auth, storage, pg_temp; SELECT n.nspname || '.' || p.proname || '(' || pg_get_function_identity_arguments(p.oid) || ')' FROM pg_proc p JOIN pg_namespace n ON n.oid = p.pronamespace WHERE p.oid = to_regprocedure('plan(integer)');")"
          if [[ "$resolved_plan" != "extensions.plan(integer)" ]]; then
            echo "::error::Expected unqualified plan(integer) to resolve to extensions.plan(integer), found '${resolved_plan:-missing}'"
            exit 1
          fi
          echo "Unqualified plan(integer) resolves to: $resolved_plan"

      # Run each checked-in suite in its own CLI invocation so every result is
      # visible. Continue through all suites, then fail the step if any failed.
      # The disposable negative control proves that a failing TAP assertion
      # produces both the expected TAP line and a nonzero CLI status.
      - name: Run database regression suites and verify TAP failure propagation
        shell: bash
        run: |
          set -euo pipefail

          suite_failures=0
          run_suite() {
            local suite="$1"
            echo "::group::pgTAP suite: $suite"
            if supabase test db --local "$suite"; then
              echo "PASS: $suite (supabase test db --local)"
            else
              local suite_status=$?
              echo "::error::$suite failed with supabase test db exit code $suite_status"
              suite_failures=1
            fi
            echo "::endgroup::"
          }

          run_suite supabase/tests/rls_regression.sql
          run_suite supabase/tests/brief_private_fields_security.sql
          run_suite supabase/tests/homeowner_public_profile_sync.sql

          # Supabase mounts test files from supabase/tests into its pgTAP
          # container, so keep the generated negative-control fixture there.
          probe_dir="$(mktemp -d "supabase/tests/.shattab-pgtap-probe.XXXXXX")"
          probe_sql="$probe_dir/failure-probe.sql"
          probe_output="${RUNNER_TEMP:-/tmp}/$(basename "$probe_dir").log"
          cleanup_probe() {
            rm -f -- "$probe_sql" "$probe_output"
            rmdir -- "$probe_dir"
          }
          trap cleanup_probe EXIT

          cat > "$probe_sql" <<'SQL'
          BEGIN;
          SET LOCAL search_path = pg_catalog, extensions, public, auth, storage, pg_temp;
          SELECT plan(1);
          SELECT ok(false, 'failure propagation probe');
          SELECT * FROM finish();
          ROLLBACK;
          SQL

          set +e
          supabase test db --local "$probe_sql" 2>&1 | tee "$probe_output"
          probe_pipeline_status=("${PIPESTATUS[@]}")
          set -e
          probe_status="${probe_pipeline_status[0]}"
          tee_status="${probe_pipeline_status[1]}"

          if [[ "$tee_status" -ne 0 ]]; then
            echo "::error::Could not capture the failure-probe output (tee exit code $tee_status)"
            suite_failures=1
          fi

          if [[ "$probe_status" -eq 0 ]]; then
            echo "::error::Failure propagation probe unexpectedly exited with status 0"
            suite_failures=1
          elif grep -Fq 'not ok 1 - failure propagation probe' "$probe_output"; then
            echo "PASS: failure probe emitted its expected not ok assertion and exited $probe_status"
          else
            echo "::error::Failure probe exited $probe_status without the expected TAP assertion"
            suite_failures=1
          fi

          if [[ "$suite_failures" -ne 0 ]]; then
            echo "::error::One or more database suites or the TAP failure-propagation probe failed"
            exit 1
          fi

  api-stage-contracts:
    name: PostgreSQL 18 API stage contracts (disposable)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    # This job uses disposable Docker containers only; it never contacts Oracle.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.22.1
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      - name: Typecheck API
        run: npm run typecheck
        working-directory: api

      - name: Test API
        run: npm test
        working-directory: api

      - name: Build API
        run: npm run build
        working-directory: api

      - name: Test staged Compose topology and static contracts
        run: python3 infra/postgres18-stage/test_api_stage_contract.py

      - name: Test API secret creation and Linux permission contract in temp paths
        run: sudo python3 infra/postgres18-stage/test_api_secret.py

      - name: Test role preflight and creation behavior in a self-owned PostgreSQL 18 container
        run: python3 infra/postgres18-stage/test_api_role_postgres18.py

  ios-build:
    name: iOS compile gate
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          cache: true

      - run: flutter pub get
      - run: cp .env.example .env
      - run: dart run build_runner build

      # Compile-only: no signing identity exists in CI. Without this gate,
      # iOS-only compile errors reach CI never (the Linux jobs cannot see them).
      - run: flutter build ios --release --no-codesign

# Database migration lint and remote Supabase advisors remain separate gates:
# they require an explicitly configured staging project and must not run against
# production from an untrusted pull request.
