name: batsh
description: "شطب (Shattab) — Egyptian contractor hiring platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  supabase_flutter: ^2.12.4

  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1

  go_router: ^17.2.3

  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  intl: ^0.20.2

  flutter_dotenv: ^6.0.1
  phone_form_field: ^10.0.17
  gap: ^3.0.1
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2
  logger: ^2.7.0
  google_fonts: ^8.1.0
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/
    - assets/icons/
