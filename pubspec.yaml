name: batsh
description: "شطّب (Shattab) - Egyptian finishing and contractor platform"
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8

  supabase_flutter: ^2.12.4

  flutter_riverpod: ^3.3.1
  riverpod_annotation: ^4.0.2
  hooks_riverpod: ^3.3.1
  flutter_hooks: ^0.21.3+1

  go_router: ^17.2.3

  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0

  intl: ^0.20.2

  flutter_dotenv: ^6.0.1
  phone_form_field: ^10.0.17
  gap: ^3.0.1
  flutter_svg: ^2.3.0
  cached_network_image: ^3.4.1
  image_picker: ^1.2.2
  logger: ^2.7.0
  google_fonts: ^8.1.0
  url_launcher: ^6.3.2
  flutter_animate: ^4.5.0
  share_plus: ^10.0.0
  flutter_image_compress: ^2.3.0
  sentry_flutter: ^8.14.2
  shared_preferences: ^2.5.3
  http: ^1.4.0

  # Push delivery only. Realtime already covers the foreground case, so there
  # is deliberately no flutter_local_notifications here: nothing needs to draw
  # a banner over an app that is already showing the live badge.
  firebase_core: ^3.8.0
  firebase_messaging: ^15.1.5

  # Connectivity transitions, so an error screen can retry itself when the
  # signal comes back instead of waiting for the user to keep tapping.
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.15.0
  freezed: ^3.2.5
  json_serializable: ^6.13.0
  riverpod_generator: ^4.0.3
  flutter_launcher_icons: ^0.14.4

flutter:
  generate: true
  uses-material-design: true

  assets:
    - .env
    - assets/icon/
    - assets/images/
    - assets/icons/

  # Bundled rather than fetched from fonts.gstatic.com at runtime. The CDN
  # path means a first launch on a weak connection renders fallback glyphs
  # until the download lands, and never renders the real face offline — on the
  # network most of these users actually have, that is the common case.
  fonts:
    - family: IBM Plex Sans Arabic
      fonts:
        - asset: assets/fonts/IBMPlexSansArabic-400.ttf
          weight: 400
        - asset: assets/fonts/IBMPlexSansArabic-500.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSansArabic-600.ttf
          weight: 600
        - asset: assets/fonts/IBMPlexSansArabic-700.ttf
          weight: 700

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#FFF8F3"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"
    background_color: "#FFF8F3"
    theme_color: "#9E3D18"
