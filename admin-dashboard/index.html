<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>شطب — لوحة التحكم</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Noto+Sans+Arabic:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --brand: #9e3d18;
  --brand-light: #c44a1e;
  --brand-dark: #7a2e12;
  --brand-bg: #fff5f0;
  --brand-50: #fef3ee;
  --brand-100: #fde4d7;
  --brand-200: #fac5a9;
  --brand-300: #f6a078;
  --brand-400: #f27b4a;
  --brand-500: #ee5a24;
  --brand-600: #c44a1e;
  --brand-700: #9e3d18;
  --brand-800: #7a2e12;
  --brand-900: #5a200c;
  --olive: #5c614d;
  --olive-light: #e0e5cc;
  --gold: #735c00;
  --gold-light: #ffe088;
  --white: #ffffff;
  --bg: #f6f5f3;
  --bg-card: #ffffff;
  --bg-sidebar: #1a1815;
  --bg-sidebar-hover: #2a2723;
  --bg-sidebar-active: #9e3d18;
  --text: #1f1b14;
  --text-secondary: #6b6558;
  --text-muted: #9c9588;
  --text-inverse: #ffffff;
  --text-sidebar: #b0a99c;
  --text-sidebar-active: #ffffff;
  --border: #ebe6dc;
  --border-light: #f3f0e9;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg: 0 10px 15px rgba(0,0,0,0.05), 0 4px 6px rgba(0,0,0,0.04);
  --shadow-xl: 0 20px 25px rgba(0,0,0,0.06), 0 10px 10px rgba(0,0,0,0.04);
  --radius-sm: 6px;
  --radius: 10px;
  --radius-lg: 14px;
  --radius-xl: 18px;
  --sidebar-w: 260px;
  --sidebar-collapsed-w: 64px;
  --topbar-h: 64px;
  --font-ui: 'Inter', -apple-system, sans-serif;
  --font-arabic: 'Noto Sans Arabic', 'Inter', -apple-system, sans-serif;
  --transition: 0.25s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  --transition-fast: 0.15s cubic-bezier(0.25, 0.46, 0.45, 0.94);
}
.dark {
  --bg: #141210;
  --bg-card: #1f1d19;
  --bg-sidebar: #0f0e0c;
  --bg-sidebar-hover: #2a2723;
  --bg-sidebar-active: #9e3d18;
  --text: #f0ece0;
  --text-secondary: #aea799;
  --text-muted: #7a7568;
  --border: #333028;
  --border-light: #2a2723;
  --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
  --shadow: 0 1px 3px rgba(0,0,0,0.3);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 15px rgba(0,0,0,0.3);
  --shadow-xl: 0 20px 25px rgba(0,0,0,0.4);
  --brand-bg: #1f0e08;
  --brand-50: #2a1209;
}
html { font-size: 15px; }
body {
  font-family: var(--font-arabic);
  background: var(--bg);
  color: var(--text);
  overflow: hidden;
  height: 100vh;
  transition: background var(--transition), color var(--transition);
}
a { text-decoration: none; color: inherit; }
button { cursor: pointer; font-family: inherit; border: none; background: none; }
input, select, textarea { font-family: inherit; }
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* Layout */
.app-layout { display: flex; height: 100vh; }
.sidebar {
  width: var(--sidebar-w);
  background: var(--bg-sidebar);
  color: var(--text-sidebar);
  display: flex;
  flex-direction: column;
  flex-shrink: 0;
  transition: width var(--transition);
  overflow: hidden;
  z-index: 100;
  position: relative;
}
.sidebar.collapsed { width: var(--sidebar-collapsed-w); }
.sidebar-brand {
  height: var(--topbar-h);
  display: flex;
  align-items: center;
  padding: 0 20px;
  gap: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.06);
  flex-shrink: 0;
}
.sidebar-brand .brand-icon {
  width: 32px; height: 32px;
  background: var(--brand);
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  color: white;
  font-weight: 800;
  font-size: 14px;
  flex-shrink: 0;
}
.sidebar-brand .brand-name {
  font-weight: 700;
  font-size: 16px;
  color: var(--text-inverse);
  white-space: nowrap;
  overflow: hidden;
}
.sidebar.collapsed .brand-name { display: none; }
.sidebar-nav {
  flex: 1;
  overflow-y: auto;
  padding: 12px 10px;
}
.sidebar-section { margin-bottom: 8px; }
.sidebar-section-title {
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  padding: 8px 12px 4px;
  opacity: 0.6;
  white-space: nowrap;
}
.sidebar.collapsed .sidebar-section-title { display: none; }
.sidebar-link {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 9px 12px;
  border-radius: var(--radius-sm);
  color: var(--text-sidebar);
  font-size: 13.5px;
  font-weight: 400;
  transition: all var(--transition-fast);
  white-space: nowrap;
  cursor: pointer;
  position: relative;
}
.sidebar-link i {
  width: 20px;
  text-align: center;
  font-size: 15px;
  flex-shrink: 0;
}
.sidebar-link:hover { background: var(--bg-sidebar-hover); color: var(--text-inverse); }
.sidebar-link.active { background: var(--bg-sidebar-active); color: var(--text-sidebar-active); font-weight: 500; }
.sidebar.collapsed .sidebar-link { justify-content: center; padding: 9px 0; }
.sidebar.collapsed .sidebar-link span { display: none; }
.sidebar-badge {
  margin-right: auto;
  background: var(--brand);
  color: white;
  font-size: 10px;
  font-weight: 600;
  padding: 1px 7px;
  border-radius: 10px;
  min-width: 18px;
  text-align: center;
}
.sidebar.collapsed .sidebar-badge { display: none; }
.sidebar-toggle {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  height: 48px;
  border-top: 1px solid rgba(255,255,255,0.06);
  color: var(--text-sidebar);
  cursor: pointer;
  transition: background var(--transition-fast);
}
.sidebar-toggle:hover { background: var(--bg-sidebar-hover); }

/* Topbar */
.main-area { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
.topbar {
  height: var(--topbar-h);
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  padding: 0 24px;
  gap: 16px;
  flex-shrink: 0;
  transition: background var(--transition), border var(--transition);
}
.topbar-search {
  flex: 1;
  max-width: 420px;
  position: relative;
}
.topbar-search i {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 14px;
}
.topbar-search input {
  width: 100%;
  height: 38px;
  padding: 0 36px 0 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  color: var(--text);
  font-size: 13px;
  outline: none;
  transition: all var(--transition-fast);
}
.topbar-search input:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(158,61,24,0.1); }
.theme-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  transition: all var(--transition-fast);
}
.theme-toggle:hover { background: var(--bg); color: var(--text); }
.notif-btn {
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  color: var(--text-secondary);
  transition: all var(--transition-fast);
}
.notif-btn:hover { background: var(--bg); color: var(--text); }
.notif-dot {
  position: absolute;
  top: 6px;
  right: 6px;
  width: 8px;
  height: 8px;
  background: var(--brand);
  border-radius: 50%;
  border: 2px solid var(--bg-card);
}
.notif-panel {
  position: absolute;
  top: calc(var(--topbar-h) - 8px);
  left: 16px;
  width: 380px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-xl);
  display: none;
  z-index: 200;
  max-height: 480px;
  overflow-y: auto;
}
.notif-panel.show { display: block; }
.notif-panel-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.notif-panel-header h3 { font-size: 14px; font-weight: 600; }
.notif-panel-header a { font-size: 12px; color: var(--brand); }
.notif-item {
  padding: 12px 20px;
  display: flex;
  gap: 12px;
  align-items: flex-start;
  transition: background var(--transition-fast);
  cursor: pointer;
}
.notif-item:hover { background: var(--brand-50); }
.notif-item.unread { background: var(--brand-50); }
.notif-item-icon {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  font-size: 13px;
  background: var(--brand-100);
  color: var(--brand);
}
.notif-item-content { flex: 1; min-width: 0; }
.notif-item-content p { font-size: 13px; line-height: 1.4; }
.notif-item-content .time { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
.profile-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  transition: background var(--transition-fast);
}
.profile-btn:hover { background: var(--bg); }
.profile-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  background: var(--brand);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 13px;
}
.profile-info { text-align: right; }
.profile-info .name { font-size: 13px; font-weight: 500; }
.profile-info .role { font-size: 11px; color: var(--text-muted); }

/* Main Content */
.content {
  flex: 1;
  overflow-y: auto;
  padding: 24px;
}
.page { display: none; animation: fadeIn 0.35s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes countUp { from { opacity: 0; } to { opacity: 1; } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes shimmer { 0% { background-position: -200% 0; } 100% { background-position: 200% 0; } }

/* KPI Cards */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
  margin-bottom: 24px;
}
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: all var(--transition);
}
.kpi-card:hover {
  box-shadow: var(--shadow-md);
  border-color: var(--border);
}
.kpi-card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.kpi-card-header .label {
  font-size: 13px;
  color: var(--text-secondary);
  font-weight: 500;
}
.kpi-card-header .icon {
  width: 36px;
  height: 36px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}
.kpi-value {
  font-size: 28px;
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 4px;
}
.kpi-change {
  font-size: 12px;
  display: flex;
  align-items: center;
  gap: 4px;
}
.kpi-change.up { color: #16a34a; }
.kpi-change.down { color: #dc2626; }
.kpi-change.neutral { color: var(--text-muted); }

/* Charts Section */
.charts-grid {
  display: grid;
  grid-template-columns: 2fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}
.chart-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  padding: 20px;
  transition: all var(--transition);
}
.chart-card:hover { box-shadow: var(--shadow-md); }
.chart-card-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.chart-card-header h3 { font-size: 15px; font-weight: 600; }
.chart-card-header select {
  font-size: 12px;
  padding: 4px 8px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--text);
  outline: none;
}
.chart-wrap { position: relative; height: 260px; }
.chart-wrap canvas { width: 100% !important; height: 100% !important; }

/* Activity Feed */
.activity-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: all var(--transition);
}
.activity-card:hover { box-shadow: var(--shadow-md); }
.activity-card-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.activity-card-header h3 { font-size: 15px; font-weight: 600; }
.activity-card-header a { font-size: 12px; color: var(--brand); }
.activity-item {
  display: flex;
  gap: 12px;
  padding: 12px 20px;
  align-items: flex-start;
  transition: background var(--transition-fast);
}
.activity-item:hover { background: var(--brand-50); }
.activity-item:not(:last-child) { border-bottom: 1px solid var(--border-light); }
.activity-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  margin-top: 6px;
  flex-shrink: 0;
}
.activity-content { flex: 1; min-width: 0; }
.activity-content p {
  font-size: 13px;
  line-height: 1.4;
}
.activity-content p strong { font-weight: 600; }
.activity-content .time {
  font-size: 11px;
  color: var(--text-muted);
  margin-top: 2px;
}

/* Bottom Grid */
.bottom-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  margin-bottom: 24px;
}

/* Quick Actions */
.quick-actions {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}
.quick-action-btn {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  padding: 16px 12px;
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 12px;
  transition: all var(--transition-fast);
}
.quick-action-btn:hover {
  border-color: var(--brand);
  color: var(--brand);
  background: var(--brand-50);
}
.quick-action-btn i {
  font-size: 18px;
}

/* Page Headers */
.page-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 24px;
}
.page-header h1 {
  font-size: 22px;
  font-weight: 700;
}
.page-header p {
  font-size: 14px;
  color: var(--text-secondary);
  margin-top: 2px;
}
.page-actions {
  display: flex;
  gap: 8px;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 16px;
  font-size: 13px;
  font-weight: 500;
  border-radius: var(--radius-sm);
  transition: all var(--transition-fast);
  cursor: pointer;
  border: none;
}
.btn-primary {
  background: var(--brand);
  color: white;
}
.btn-primary:hover { background: var(--brand-light); }
.btn-secondary {
  background: var(--bg);
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-secondary:hover { background: var(--border-light); }
.btn-outline {
  background: transparent;
  color: var(--brand);
  border: 1px solid var(--brand);
}
.btn-outline:hover { background: var(--brand-50); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.btn-icon {
  width: 36px;
  height: 36px;
  padding: 0;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* Data Table */
.table-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  overflow: hidden;
  transition: all var(--transition);
}
.table-card:hover { box-shadow: var(--shadow-md); }
.table-header {
  padding: 16px 20px;
  border-bottom: 1px solid var(--border-light);
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.table-header h3 { font-size: 15px; font-weight: 600; }
.table-toolbar {
  display: flex;
  gap: 8px;
  align-items: center;
}
.table-toolbar input {
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  background: var(--bg);
  color: var(--text);
  font-size: 12px;
  outline: none;
  width: 200px;
}
.table-toolbar input:focus { border-color: var(--brand); }
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
}
table th {
  text-align: right;
  padding: 12px 16px;
  font-size: 11px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--text-muted);
  border-bottom: 1px solid var(--border-light);
  white-space: nowrap;
}
table td {
  padding: 12px 16px;
  font-size: 13px;
  border-bottom: 1px solid var(--border-light);
}
table tr:last-child td { border-bottom: none; }
table tr:hover td { background: var(--brand-50); }
.user-cell {
  display: flex;
  align-items: center;
  gap: 10px;
}
.user-avatar {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 600;
  font-size: 12px;
  flex-shrink: 0;
}
.user-avatar.ho { background: #dbeafe; color: #1d4ed8; }
.user-avatar.co { background: var(--brand-100); color: var(--brand); }
.user-avatar.ad { background: var(--olive-light); color: var(--olive); }
.status-badge {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  padding: 2px 10px;
  border-radius: 12px;
  font-size: 11px;
  font-weight: 500;
}
.status-badge.active { background: #dcfce7; color: #15803d; }
.status-badge.pending { background: #fef9c3; color: #a16207; }
.status-badge.suspended { background: #fee2e2; color: #b91c1c; }
.status-badge.verified { background: #dcfce7; color: #15803d; }
.status-badge.rejected { background: #fee2e2; color: #b91c1c; }
.status-badge.open { background: #dbeafe; color: #1d4ed8; }
.status-badge.in-progress { background: #fef9c3; color: #a16207; }
.status-badge.completed { background: #dcfce7; color: #15803d; }
.status-badge.cancelled { background: #f3f0e9; color: #6b6558; }
.dark .status-badge.active { background: rgba(22,163,74,0.15); }
.dark .status-badge.pending { background: rgba(234,179,8,0.15); }
.dark .status-badge.suspended { background: rgba(220,38,38,0.15); }
.dark .status-badge.verified { background: rgba(22,163,74,0.15); }
.dark .status-badge.rejected { background: rgba(220,38,38,0.15); }
.dark .status-badge.open { background: rgba(59,130,246,0.15); }
.dark .status-badge.in-progress { background: rgba(234,179,8,0.15); }
.dark .status-badge.completed { background: rgba(22,163,74,0.15); }
.dark .status-badge.cancelled { background: rgba(107,101,88,0.15); }

.table-pagination {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 12px 20px;
  border-top: 1px solid var(--border-light);
  font-size: 12px;
  color: var(--text-muted);
}
.pagination-btns { display: flex; gap: 4px; }

  width: 32px;
  height: 32px;
  border-radius: var(--radius-sm);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  transition: all var(--transition-fast);
}
.pagination-btns button:hover { border-color: var(--brand); color: var(--brand); }
.pagination-btns button.active { background: var(--brand); color: white; border-color: var(--brand); }

/* Stats Grid */
.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--bg-card);
  border: 1px solid var(--border-light);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  transition: all var(--transition);
}
.stat-card:hover { box-shadow: var(--shadow-md); }
.stat-value { font-size: 24px; font-weight: 700; }
.stat-label { font-size: 12px; color: var(--text-secondary); margin-top: 2px; }

/* Scrollbar for content */
.content::-webkit-scrollbar { width: 4px; }
.content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

/* Skeleton loading */
.skeleton {
  background: linear-gradient(90deg, var(--border-light) 25%, var(--bg) 50%, var(--border-light) 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: var(--radius-sm);
}

/* Map placeholder */
.map-placeholder {
  height: 300px;
  background: var(--brand-50);
  border: 1px solid var(--border-light);
  border-radius: var(--radius-lg);
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-muted);
  font-size: 14px;
  gap: 8px;
  margin-bottom: 24px;
}

/* AI Insights bar */
.insights-bar {
  background: var(--brand-50);
  border: 1px solid var(--brand-100);
  border-radius: var(--radius-lg);
  padding: 16px 20px;
  margin-bottom: 24px;
  display: flex;
  align-items: center;
  gap: 12px;
  overflow: hidden;
}
.insights-bar i {
  font-size: 16px;
  color: var(--brand);
  flex-shrink: 0;
}
.insights-scroll {
  display: flex;
  gap: 24px;
  overflow-x: auto;
  flex: 1;
  -ms-overflow-style: none;
  scrollbar-width: none;
}
.insights-scroll::-webkit-scrollbar { display: none; }
.insight-chip {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  color: var(--brand-dark);
  white-space: nowrap;
  padding: 4px 0;
}
.insight-chip i { font-size: 12px; }
.insight-chip .up { color: #16a34a; }
.insight-chip .down { color: #dc2626; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 60px 20px;
  color: var(--text-muted);
}
.empty-state i { font-size: 48px; margin-bottom: 16px; opacity: 0.4; }
.empty-state h3 { font-size: 16px; font-weight: 600; color: var(--text-secondary); margin-bottom: 4px; }
.empty-state p { font-size: 13px; }

/* Responsive */
@media (max-width: 1200px) {
  .charts-grid { grid-template-columns: 1fr; }
  .bottom-grid { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {

function kpiCard(label, value, change, direction, icon, color, bg) {
  const arrow = direction === 'up' ? 'fa-arrow-up' : direction === 'down' ? 'fa-arrow-down' : 'fa-minus';
  return `
    <div class="kpi-card">
      <div class="kpi-card-header">
        <span class="label">${label}</span>
        <span class="icon" style="background:${bg};color:${color}"><i class="fas ${icon}"></i></span>
      </div>
      <div class="kpi-value">${value}</div>
      <div class="kpi-change ${direction}"><i class="fas ${arrow}"></i> ${change} عن الشهر الماضي</div>
    </div>
  `;
}

function renderTable(page) {
  let title, data, cols;
  if (page === 'users') {
    title = 'المستخدمين';
    data = users;
    cols = ['#', 'الاسم', 'البريد', 'نوع الحساب', 'الحالة', 'المدينة', 'تاريخ التسجيل'];
  } else if (page === 'contractors') {
    title = 'المقاولين';
    data = users.filter(u => u.role === 'co');
    cols = ['#', 'المقاول', 'البريد', 'الحالة', 'المدينة', 'المشاريع', 'الإيرادات'];
  } else {
    title = 'العملاء';
    data = users.filter(u => u.role === 'ho');
    cols = ['#', 'العميل', 'البريد', 'الحالة', 'المدينة', 'المشاريع', 'المنفق'];
  }
  return `
    <div class="page-header">
      <div>
        <h1>${title}</h1>
        <p>إدارة وعرض جميع ${title.toLowerCase()} على المنصة</p>
      </div>
      <div class="page-actions">
        <button class="btn btn-secondary"><i class="fas fa-filter"></i> تصفية</button>
        <button class="btn btn-secondary"><i class="fas fa-download"></i> تصدير</button>
        <button class="btn btn-primary"><i class="fas fa-plus"></i> إضافة</button>
      </div>
    </div>
    <div class="table-card">
      <div class="table-header">
        <h3>جميع ${title}</h3>
        <div class="table-toolbar">
          <input type="text" placeholder="بحث..." oninput="filterTable(this.value)">
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>
          <tbody>
            ${data.map((u, i) => {
              const avatarClass = u.role === 'co' ? 'co' : 'ho';
              const initials = u.name.slice(0, 2);
              const statusClass = u.status;
              return `<tr>
                <td style="color:var(--text-muted);font-size:12px">${u.id}</td>
                <td><div class="user-cell"><div class="user-avatar ${avatarClass}">${initials}</div> ${u.name}</div></td>
                <td style="color:var(--text-secondary)">${u.email}</td>
                <td><span style="font-size:12px;color:var(--text-secondary)">${u.roleLabel}</span></td>
                <td><span class="status-badge ${statusClass}">${statusClass === 'active' ? 'نشط' : statusClass === 'verified' ? 'موثق' : statusClass === 'pending' ? 'معلق' : 'موقوف'}</span></td>
                <td>${u.city}</td>
                <td>${page === 'contractors' ? u.projects : page === 'customers' ? u.projects : u.joined}</td>
                ${page === 'contractors' ? `<td style="direction:ltr;text-align:right">${u.revenue?.toLocaleString('ar-EG')} ج.م</td>` : ''}
                ${page === 'customers' ? `<td style="direction:ltr;text-align:right">${u.spent?.toLocaleString('ar-EG')} ج.م</td>` : ''}
              </tr>`;
            }).join('')}
          </tbody>
        </table>
      </div>
      <div class="table-pagination">
        <span>عرض ١-${data.length} من ${data.length}</span>
        <div class="pagination-btns"><button class="active">١</button></div>
      </div>
    </div>
  `;
}

// ─── Theme ──────────────────────────────────────────────────────────────────
function toggleDarkMode() {
  document.body.classList.toggle('dark');
  const isDark = document.body.classList.contains('dark');
  localStorage.setItem('theme', isDark ? 'dark' : 'light');
  document.querySelector('#themeToggle i').className = isDark ? 'fas fa-sun' : 'fas fa-moon';
  const sw = document.getElementById('darkModeSwitch');
  if (sw) sw.checked = isDark;

  // Update slider style
  const slider = document.querySelector('#darkModeSwitch + span');
  if (slider && isDark) {
    slider.style.background = '#9e3d18';
    slider.nextElementSibling.style.transform = 'translateX(20px)';
  } else if (slider) {
    slider.style.background = '';
    slider.nextElementSibling.style.transform = '';
  }
}

document.getElementById('themeToggle').addEventListener('click', toggleDarkMode);

// Load saved theme
const savedTheme = localStorage.getItem('theme');
if (savedTheme === 'dark') {
  document.body.classList.add('dark');
  document.querySelector('#themeToggle i').className = 'fas fa-sun';
}

// ─── Sidebar Toggle ─────────────────────────────────────────────────────────
document.getElementById('sidebarToggle').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('collapsed');
});

// ─── Notifications ─────────────────────────────────────────────────────────
document.getElementById('notifBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  document.getElementById('notifPanel').classList.toggle('show');
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('.notif-btn') && !e.target.closest('.notif-panel')) {
    closeNotifPanel();
  }
});

// Populate notification panel
document.getElementById('notifList').innerHTML = notifications.slice(0,4).map(n => `
  <div class="notif-item${n.unread ? ' unread' : ''}">
    <div class="notif-item-icon"><i class="fas ${n.icon}"></i></div>
    <div class="notif-item-content">
      <p>${n.text}</p>
      <div class="time">${n.time}</div>
    </div>
  </div>
`).join('');

// ─── Init ───────────────────────────────────────────────────────────────────
function scrollInsights() {
  const el = document.getElementById('insightsScroll');
  if (el) el.scrollBy({ left: 200, behavior: 'smooth' });
}

// Build sidebar and start
buildSidebar();
navigate('dashboard');
</script>
